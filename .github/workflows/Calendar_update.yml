name: Update Academic Calendar

on:
  schedule:
    # 每天 UTC 時間 00:00 執行 (約台灣時間早上 08:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許手動按按鈕觸發

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # 給予寫入權限以便 commit

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run calendar crawler
      run: |
        python nsysu_calendar.py

    - name: Commit and push if changed
      run: |
        git config --global user.name 'GitHub Action Bot'
        git config --global user.email 'action@github.com'
        # 檢查是否有檔案被修改
        if [[ -n $(git status --porcelain calendar.json) ]]; then
          echo "Detect changes in calendar.json"
          git add calendar.json
          git commit -m "Auto-update calendar.json $(date +'%Y-%m-%d')"
          git push
        else
          echo "No changes detected"
        fi
