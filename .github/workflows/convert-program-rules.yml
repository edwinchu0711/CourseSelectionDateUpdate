name: Convert Program Rules_old

on:
  push:
    paths:
      - "program-rule-converter/data/pdfs/**/*.pdf"
      - "program-rule-converter/scripts/**"
      - "program-rule-converter/schemas/**"
      - "program-rule-converter/src/**"
      - ".github/workflows/convert-program-rules.yml"
  workflow_dispatch:
    inputs:
      max_update:
        description: 'Maximum PDFs to download/update (預設 5)'
        required: false
        default: '5'
        type: string
      llm_base_url:
        description: 'LLM API Base URL (留空則使用預設或 Secret)'
        required: false
        default: ''
        type: string
      llm_model:
        description: 'LLM Model (留空則使用預設或 Secret)'
        required: false
        default: ''
        type: string
      llm_api_key:
        description: 'LLM API Key (留空則使用 Secret)'
        required: false
        default: ''
        type: string

defaults:
  run:
    working-directory: program-rule-converter

jobs:
  convert:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download PDFs (incremental)
        env:
          INPUT_KEY: ${{ inputs.llm_api_key }}
          SECRET_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          MAX_UPDATE="${{ inputs.max_update }}"
          if [ -z "$MAX_UPDATE" ]; then
            MAX_UPDATE="5"
          fi
          export LLM_API_KEY="${INPUT_KEY:-$SECRET_KEY}"
          python 學程.py --download --max-update "$MAX_UPDATE"

      - name: Extract PDFs
        run: |
          mkdir -p data/extracted/raw
          if [ -f data/updated_basenames.txt ]; then
            while IFS= read -r base || [ -n "$base" ]; do
              if [ -n "$base" ]; then
                echo "Extracting: $base"
                python scripts/extract_pdf.py "data/pdfs/${base}.pdf" "data/extracted/raw/${base}.raw.json"
              fi
            done < data/updated_basenames.txt
          fi

      - name: Convert with LLM
        env:
          INPUT_KEY: ${{ inputs.llm_api_key }}
          INPUT_MODEL: ${{ inputs.llm_model }}
          INPUT_BASE_URL: ${{ inputs.llm_base_url }}
          SECRET_KEY: ${{ secrets.LLM_API_KEY }}
          SECRET_MODEL: ${{ secrets.LLM_MODEL }}
          SECRET_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          export LLM_API_KEY="${INPUT_KEY:-$SECRET_KEY}"
          export LLM_MODEL="${INPUT_MODEL:-$SECRET_MODEL}"
          export LLM_BASE_URL="${INPUT_BASE_URL:-$SECRET_BASE_URL}"

          mkdir -p data/extracted/structured
          if [ -f data/updated_basenames.txt ]; then
            while IFS= read -r base || [ -n "$base" ]; do
              if [ -n "$base" ]; then
                echo "Converting: $base"
                python scripts/convert_with_llm.py "data/extracted/raw/${base}.raw.json" "data/extracted/structured/${base}.extracted.json"
              fi
            done < data/updated_basenames.txt
          fi

      - name: Normalize rules
        run: |
          mkdir -p data/rules/generated
          if [ -f data/updated_basenames.txt ]; then
            while IFS= read -r base || [ -n "$base" ]; do
              if [ -n "$base" ]; then
                echo "Normalizing: $base"
                python scripts/normalize_rules.py "data/extracted/structured/${base}.extracted.json" "data/rules/generated/${base}.generated.json"
              fi
            done < data/updated_basenames.txt
          fi

      - name: Apply overrides
        run: |
          mkdir -p data/rules/final
          if [ -f data/updated_basenames.txt ]; then
            while IFS= read -r base || [ -n "$base" ]; do
              if [ -n "$base" ]; then
                echo "Applying overrides: $base"
                override="data/overrides/${base}.json"
                output="data/rules/final/${base}.json"
                if [ -f "$override" ]; then
                  python scripts/apply_overrides.py "data/rules/generated/${base}.generated.json" "$override" "$output"
                else
                  cp "data/rules/generated/${base}.generated.json" "$output"
                fi
              fi
            done < data/updated_basenames.txt
          fi

      - name: Validate schema
        run: |
          for rule in data/rules/final/*.json; do
            if [ -f "$rule" ]; then
              python scripts/validate_schema.py schemas/program-rule.schema.json "$rule"
            fi
          done

      - name: Validate business rules
        run: |
          for rule in data/rules/final/*.json; do
            if [ -f "$rule" ]; then
              python scripts/validate_rules.py "$rule"
            fi
          done

      - name: Run tests
        run: |
          pytest

      - name: Generate diff reports
        run: |
          mkdir -p reports
          for final in data/rules/final/*.json; do
            if [ -f "$final" ]; then
              base=$(basename "$final" .json)
              approved="data/rules/approved/${base}.json"
              report="reports/${base}.diff.md"
              if [ -f "$approved" ]; then
                python scripts/diff_rules.py "$approved" "$final" "$report"
              fi
            fi
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update generated program rules"
          title: "Update generated program rules"
          body: |
            This PR was generated automatically from PDF files.

            Validation steps:
            - PDF extraction
            - LLM structured conversion
            - Rule normalization
            - Manual override application
            - JSON Schema validation
            - Business validation
            - Tests
            - Diff report generation

            Please review changed JSON files and reports.
          branch: bot/update-program-rules