name: Fetch & Process Programs (Multi-shard)

on:
  # schedule:
  #   - cron: '0 3 * * 1'   # 每週一 UTC 3am
  workflow_dispatch:
    inputs:
      force_update:
        description: '強制重新處理所有學程（忽略大小比對）'
        type: boolean
        default: false
      skip_fetch:
        description: '跳過「抓取 PDF、比對大小」步驟（直接使用現有 changed_programs.json）'
        type: boolean
        default: false
      model:
        description: '模型名稱 (留空使用預設)'
        required: false
        default: ''
      num_shards:
        description: '平行處理的 Job 數量'
        type: number
        default: 3

jobs:
  # ─────────────────────────────────────────────────────────
  # Step 1: 抓取 PDF、比對大小、PDF → TXT、產生分片索引
  # ─────────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.set-shards.outputs.matrix }}
      num_shards: ${{ steps.set-shards.outputs.num_shards }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai beautifulsoup4 requests openai httpx python-dotenv

      # ── 僅在「不跳過」時執行抓取與比對 ──────────────────
      - name: Scrape & Compare sizes
        if: ${{ inputs.skip_fetch != true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import json, sys
          sys.path.insert(0, 'program')
          from 學程 import scrape_nsysu_programs
          programs = scrape_nsysu_programs()
          with open('program/scraped_programs.json', 'w', encoding='utf-8') as f:
              json.dump(programs, f, ensure_ascii=False, indent=2)
          print(f'抓取到 {len(programs)} 個學程')
          "

          python -c "
          import json, os, requests
          with open('program/scraped_programs.json', encoding='utf-8') as f:
              programs = json.load(f)
          metadata_path = 'program/metadata.json'
          metadata = json.load(open(metadata_path, encoding='utf-8')) if os.path.exists(metadata_path) else {}
          changed = []
          for p in programs:
              name, url = p['name'], p['link']
              try:
                  resp = requests.head(url, allow_redirects=True, timeout=10)
                  current_size = int(resp.headers.get('content-length', 0))
              except Exception as e:
                  print(f'⚠️ 無法取得 {name}: {e}')
                  current_size = 0
              prev_size = metadata.get(name, {}).get('size', 0)
              if current_size != prev_size and current_size > 0:
                  changed.append({'name': name, 'url': url, 'size': current_size})
          with open('program/changed_programs.json', 'w', encoding='utf-8') as f:
              json.dump(changed, f, ensure_ascii=False, indent=2)
          print(f'共 {len(changed)} 個學程有變更')
          "

          if [ "${{ inputs.force_update }}" = "true" ]; then
            python -c "
          import json, requests
          with open('program/scraped_programs.json', encoding='utf-8') as f:
              programs = json.load(f)
          all_programs = []
          for p in programs:
              url = p.get('link', '')
              try:
                  resp = requests.head(url, allow_redirects=True, timeout=10)
                  size = int(resp.headers.get('content-length', 0))
              except:
                  size = 0
              all_programs.append({'name': p['name'], 'url': url, 'size': size})
          with open('program/changed_programs.json', 'w', encoding='utf-8') as f:
              json.dump(all_programs, f, ensure_ascii=False, indent=2)
          print(f'強制處理 {len(all_programs)} 個學程')
          "
          fi

      # ── 跳過時：印出目前 changed_programs.json 的內容供確認 ──
      - name: Skip fetch - show existing changed_programs.json
        if: ${{ inputs.skip_fetch == true }}
        run: |
          echo "⏭️ 已跳過抓取步驟，使用現有的 changed_programs.json"
          python -c "
          import json, os
          path = 'program/changed_programs.json'
          if os.path.exists(path):
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              print(f'📄 現有 changed_programs.json 包含 {len(data)} 個學程')
              for p in data:
                  print(f'  - {p.get(\"name\", \"?\")}')
          else:
              print('⚠️ 找不到 changed_programs.json，將建立空清單')
              os.makedirs('program', exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump([], f)
          "

      - name: Process changed PDFs (PDF → TXT)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_update }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python program/process_programs.py --ci $FORCE_FLAG --changed-file program/changed_programs.json

      - name: 產生分片索引
        id: set-shards
        run: |
          NUM_SHARDS="${{ inputs.num_shards }}"
          if [ -z "$NUM_SHARDS" ]; then
            NUM_SHARDS=3
          fi
          
          MATRIX_JSON=$(python -c "import json; print(json.dumps([str(i) for i in range(int($NUM_SHARDS))]))")
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
          echo "num_shards=$NUM_SHARDS" >> $GITHUB_OUTPUT

          python -c "
          import json, os, glob

          txt_files = sorted(glob.glob('program/data/*.txt'))
          print(f'找到 {len(txt_files)} 個 txt 檔案')

          NUM_SHARDS = int($NUM_SHARDS)
          os.makedirs('program/shards', exist_ok=True)

          for shard_id in range(NUM_SHARDS):
              shard = [f for i, f in enumerate(txt_files) if i % NUM_SHARDS == shard_id]
              with open(f'program/shards/shard_{shard_id}.json', 'w') as f:
                  json.dump(shard, f)
              print(f'Shard {shard_id}: {len(shard)} 個檔案')
          "

      - name: Upload workspace artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: |
            program/data/
            program/shards/
            program/changed_programs.json
            program/scraped_programs.json

  # ─────────────────────────────────────────────────────────
  # Step 2: 平行分片轉換（10 個 shard 並行）
  # ─────────────────────────────────────────────────────────
  convert:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard_id: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai beautifulsoup4 requests openai httpx python-dotenv

      - name: Download workspace artifact
        uses: actions/download-artifact@v4
        with:
          name: workspace
          path: program/

      - name: Convert TXT → JSON (Shard ${{ matrix.shard_id }})
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          FILES=$(python -c "
          import json
          with open('program/shards/shard_${{ matrix.shard_id }}.json') as f:
              files = json.load(f)
          print(' '.join(files))
          ")

          ARGS=(--files $FILES)

          if [ -n "$LLM_BASE_URL" ]; then
            ARGS+=(--base-url "$LLM_BASE_URL")
          fi

          if [ -n "${{ inputs.model }}" ]; then
            ARGS+=(--model "${{ inputs.model }}")
          elif [ -n "$LLM_MODEL" ]; then
            ARGS+=(--model "$LLM_MODEL")
          fi

          ARGS+=(--api-key "$LLM_API_KEY")

          python -u program/convert.py "${ARGS[@]}"

      - name: Upload shard result
        uses: actions/upload-artifact@v4
        with:
          name: shard-result-${{ matrix.shard_id }}
          path: program/rules/

  # ─────────────────────────────────────────────────────────
  # Step 3: 合併所有 JSON → commit
  # ─────────────────────────────────────────────────────────
  merge-and-commit:
    needs: convert
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai beautifulsoup4 requests openai httpx python-dotenv

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace
          path: program/

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: shard-result-*
          path: /tmp/shard_results/
          merge-multiple: false

      - name: Merge shard results
        env:
          NUM_SHARDS: ${{ needs.prepare.outputs.num_shards }}
        run: |
          python -c "
          import json, os

          def load_json(path):
              try:
                  with open(path, encoding='utf-8') as f:
                      data = json.load(f)
                  return data if isinstance(data, list) else data.get('programs', [])
              except:
                  return []

          num_shards = int(os.environ.get('NUM_SHARDS', 3))
          all_programs = []
          for shard_id in range(num_shards):
              path = f'/tmp/shard_results/shard-result-{shard_id}/rules.json'
              programs = load_json(path)
              all_programs.extend(programs)
              print(f'Shard {shard_id}: 載入 {len(programs)} 個學程')

          merged = {}
          for program in all_programs:
              name = program.get('program_name', '')
              if name not in merged:
                  merged[name] = program
              else:
                  existing_versions = merged[name].setdefault('versions', [])
                  for v in program.get('versions', []):
                      ny, ns = v.get('academic_year'), v.get('semester')
                      duplicate = any(
                          ev.get('academic_year') == ny and ev.get('semester') == ns
                          for ev in existing_versions
                      )
                      if not duplicate:
                          existing_versions.append(v)
                  existing_versions.sort(
                      key=lambda v: (v.get('academic_year', 0), v.get('semester', 0))
                  )

          result = list(merged.values())
          os.makedirs('program/rules', exist_ok=True)
          with open('program/rules/rules.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          print(f'✅ 合併完成，共 {len(result)} 個學程')
          "

      - name: Build manifest
        run: python program/build_manifest.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add program/data/ program/metadata.json program/rules/ program/programs.json program/changed_programs.json program/scraped_programs.json
          git diff --staged --quiet || git commit -m "自動更新學程資料 $(date +'%Y-%m-%d %H:%M:%S')"
          git push