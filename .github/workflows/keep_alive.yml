name: Trigger Render Crawl and Save Data

on:
  schedule:
    - cron: '0 18 * * *' # 台灣時間 02:00
  workflow_dispatch:

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run Scraper and Update File
        shell: python
        run: |
          import datetime
          import os
          import requests
          import time
          import json

          # 1. 判斷邏輯 (略...)
          
          # 2. 觸發 Render 開始爬蟲
          run_url = "https://courseselectiondate.onrender.com/run"
          get_url = "https://courseselectiondate.onrender.com/get_data"
          
          try:
              print("🚀 觸發 Render 執行爬蟲...")
              requests.get(run_url, timeout=30)
          except Exception as e:
              print(f"⚠️ 觸發可能超時，但任務可能已開始: {e}")

          # 3. 等待 3 分鐘 (360秒)
          print("⏳ 等待 3 分鐘讓 Render 完成運算與 AI 處理...")
          time.sleep(360)

          # 4. 索取資料
          print("📥 正在從 Render 索取資料...")
          try:
              res = requests.get(get_url, timeout=30)
              if res.status_code == 200:
                  data = res.json()
                  with open('data.json', 'w', encoding='utf-8') as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)
                  print("✅ 資料抓取成功並已寫入 data.json")
              else:
                  print(f"❌ 資料尚未準備好或出錯: {res.status_code}")
                  exit(1)
          except Exception as e:
              print(f"❌ 索取資料失敗: {e}")
              exit(1)

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          # 只有在檔案有變動時才 commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 自動更新課程日期資料: $(date +'%Y-%m-%d %H:%M')" && git push)
