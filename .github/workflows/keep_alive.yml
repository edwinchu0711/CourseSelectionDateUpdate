name: Trigger Render Crawl and Save Data

on:
  schedule:
    - cron: '0 18 * * *' # 台灣時間 02:00
  workflow_dispatch:

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run Scraper and Update File
        shell: python
        run: |
          import datetime
          import os
          import requests
          import time
          import json

          # 1. 判斷日期邏輯 (保持你原本的邏輯)
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))
          in_range_winter = (now.month == 12 and now.day >= 15) or (now.month in [1, 2])
          in_range_summer = (now.month == 5 and now.day >= 20) or (now.month in [6, 7, 8]) or (now.month == 9 and now.day <= 10)
          
          should_run = in_range_winter or in_range_summer or (now.day % 3 == 1)

          if not should_run:
              print("📅 今日不需更新，跳過。")
              exit(0)

          # 2. 呼叫 API 並處理冷啟動
          url = "https://courseselectiondate.onrender.com/run"
          print(f"🚀 正在請求 Render API (含冷啟動等待): {url}")
          
          # Render 冷啟動可能需要幾分鐘，這裡設定超長 timeout (600秒 = 10分鐘)
          # 因為我們把 Flask 改成同步執行，所以 API 會等爬蟲跑完才回傳
          try:
              # 第一次請求（如果是睡眠狀態，Render 會開始喚醒）
              res = requests.get(url, timeout=600) 
              if res.status_code == 200:
                  data = res.json()
                  # 3. 寫入 data.json
                  with open('data.json', 'w', encoding='utf-8') as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)
                  print("✅ 資料抓取成功並已寫入 data.json")
              else:
                  print(f"❌ API 報錯: {res.status_code}")
                  exit(1)
          except Exception as e:
              print(f"❌ 請求過程中發生錯誤: {e}")
              exit(1)

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          # 只有在檔案有變動時才 commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 自動更新課程日期資料: $(date +'%Y-%m-%d %H:%M')" && git push)
