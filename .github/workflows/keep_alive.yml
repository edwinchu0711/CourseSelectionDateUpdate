name: Trigger Render Crawl API

on:
  schedule:
    # 建議每 13 分鐘執行一次，確保不被休眠
    - cron: '*/13 * * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  ping_api:
    runs-on: ubuntu-latest
    steps:
      - name: Send POST request to Render
        run: |
          curl -X POST https://nsysugrades2-0.onrender.com/api/scrape \
          -H "Content-Type: application/json" \
          -d '{"task": "test"}' \
          --verbose
