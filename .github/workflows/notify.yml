name: Check Schedule and Notify

on:
  schedule:
    # UTC 時間 00:00 = 台灣時間 08:00
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許手動按按鈕觸發測試

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install axios googleapis

      - name: Run Notification Script
        env:
          # 記得去 GitHub Repo Settings -> Secrets -> Actions 加上 FIREBASE_KEY
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: node scripts/notify_from_json.js
